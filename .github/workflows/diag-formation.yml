name: diag-formation
on:
  push:
    branches: [diag-formation]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe third-party coach sequence sources
        shell: bash {0}
        run: |
          D=$(curl -s -m 90 https://mvb-app.onrender.com/api/formation/diag)
          N=$(echo "$D" | python3 -c "import sys,json; t=[x for x in json.load(sys.stdin).get('trains',[]) if x.get('trainCat') in ('ICE','IC','EC')] or [{}]; print(t[0].get('trainNum',''), t[0].get('trainCat',''), t[0].get('time',''))")
          set -- $N; NUM=$1; CAT=$2; T=$3
          ISO="2026-10-28T${T}:00+01:00"; ENC=$(python3 -c "import urllib.parse;print(urllib.parse.quote('$ISO'))")
          r="train $CAT $NUM $T"
          for u in \
            "https://bahn.expert/api/coachSequence/v4/wagen/$NUM?evaNumber=8010224&departure=$ENC&category=$CAT" \
            "https://bahn.expert/api/coachSequence/v4/sequence?trainNumber=$NUM&evaNumber=8010224&departure=$ENC&category=$CAT" \
            "https://bahn.expert/rpc/coachSequence.sequence?input=%7B%22trainNumber%22%3A$NUM%2C%22evaNumber%22%3A%228010224%22%2C%22departure%22%3A%22$ENC%22%2C%22category%22%3A%22$CAT%22%7D" \
            "https://bahn.expert/" ; do
            c=$(curl -s -o /tmp/b -w '%{http_code}' -m 25 -A 'Mozilla/5.0' "$u" || true); r="$r || ${u:0:70} => $c $(head -c 160 /tmp/b | tr -d '\n\"')"
          done
          echo "::notice title=probe::$r"
