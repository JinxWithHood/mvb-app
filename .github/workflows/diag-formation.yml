name: diag-formation
on:
  push:
    branches: [diag-formation]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check what Render serves
        shell: bash {0}
        run: |
          B=https://mvb-app.onrender.com
          v=$(curl -s -m 90 "$B/" | grep -o 'formation.js?v=[0-9.]*\|app.js?v=[0-9.]*\|styles.css?v=[0-9.]*' | tr '\n' ' ')
          f=$(curl -s -m 60 "$B/formation.js" | grep -c 'fetchDirect')
          sw=$(curl -s -m 60 "$B/sw.js" | grep -o "mvb-magdeburg-cache-v[0-9-]*")
          fs=$(curl -s -m 60 -o /dev/null -w '%{http_code}' "$B/formation.js")
          d=$(curl -s -m 90 "$B/api/formation/diag" | head -c 600)
          echo "::notice title=render::index: $v | formation.js http $fs, fetchDirect=$f | sw: $sw | diag: $d"
