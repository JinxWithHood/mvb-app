name: diag-formation
on:
  push:
    branches: [diag-formation]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: bahnhof.de coach sequence pages
        shell: bash {0}
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          curl -s -L -A "$UA" -m 30 https://www.bahnhof.de/magdeburg-hbf/abfahrt -o dep.html
          grep -oE '/magdeburg-hbf/abfahrt/wagenreihung/[^"\\ ]+' dep.html | sort -u > links.txt
          echo "LINKS $(wc -l < links.txt): $(head -3 links.txt | tr '\n' ' ')" > rep.txt
          l=$(head -1 links.txt)
          curl -s -L -A "$UA" -m 30 "https://www.bahnhof.de$l" -o wr.html
          echo "WR $(wc -c < wr.html) bytes" >> rep.txt
          python3 - <<'PY' >> rep.txt
          import re
          s = open('wr.html', encoding='utf-8', errors='replace').read()
          s2 = s.replace('\\"', '"')
          for k in ['platformPosition', 'wagonIdentificationNumber', 'vehicles', 'sectors', 'hasFirstClass', 'category', 'sector', 'orientation', 'vehicleID', 'groups']:
              print(k, s2.count('"' + k + '"'))
          i = s2.find('"vehicles"')
          print('SNIP', re.sub(r'\s+', ' ', s2[max(0, i - 600): i + 1400]))
          d = open('dep.html', encoding='utf-8', errors='replace').read().replace('\\"', '"')
          j = d.find('wagenreihung/')
          print('DEPSNIP', re.sub(r'\s+', ' ', d[max(0, j - 900): j + 300]))
          PY
          echo "::notice title=b1::$(head -c 3900 rep.txt | tr '\n' ' ')"
          echo "::notice title=b2::$(tail -c +3900 rep.txt | head -c 3900 | tr '\n' ' ')"
