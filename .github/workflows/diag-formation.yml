name: diag-formation
on:
  push:
    branches: [diag-formation]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Render diag after deploy
        shell: bash {0}
        run: |
          sleep 210
          for i in 1 2 3 4 5 6; do
            d=$(curl -s -m 90 https://mvb-app.onrender.com/api/formation/diag)
            echo "$d" | grep -q '"hosts"' && break; sleep 30
          done
          echo "::notice title=probe::$(echo "$d" | head -c 1500)"
