name: diag-formation
on:
  push:
    branches: [diag-formation]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Watch bahnhof.de network traffic
        shell: bash {0}
        run: |
          npm i playwright@1.47.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > w.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const p = await b.newPage({ locale: 'de-DE' });
            const log = [];
            p.on('response', async r => {
              const u = r.url(); const ct = r.headers()['content-type'] || '';
              if (/\.(js|css|woff2?|png|svg|jpg|webp|ico)(\?|$)/.test(u) || u.includes('/_next/static')) return;
              let body = '';
              try { if (/json|text\/x-component|text\/plain/.test(ct)) body = (await r.text()).slice(0, 300).replace(/\s+/g, ' '); } catch (e) {}
              log.push(`${r.request().method()} ${r.status()} ${u.slice(0, 220)} [${ct.slice(0, 30)}] hdr:${JSON.stringify(Object.keys(r.request().headers()).filter(h => /^(rsc|next-|x-)/i.test(h)))} ${body}`);
            });
            await p.goto('https://www.bahnhof.de/magdeburg-hbf/abfahrt', { waitUntil: 'networkidle', timeout: 60000 });
            await p.waitForTimeout(4000);
            const links = await p.$$eval('a[href*="wagenreihung"]', as => as.map(a => a.getAttribute('href')));
            log.push('LINKS ' + links.length + ' ' + links.slice(0, 3).join(' '));
            if (links[0]) {
              log.push('---- open coach sequence');
              await p.goto('https://www.bahnhof.de' + links[0], { waitUntil: 'networkidle', timeout: 60000 });
              await p.waitForTimeout(3000);
              const html = await p.content();
              const i = html.indexOf('Wagen');
              log.push('TEXT ' + (await p.innerText('main').catch(() => '')).slice(0, 600).replace(/\s+/g, ' '));
            }
            require('fs').writeFileSync('log.txt', log.join('\n'));
            await b.close();
          })();
          JS
          node w.js || echo "node failed" > log.txt
          grep -v "google\|analytics\|sentry\|consent\|usercentrics\|matomo\|etracker" log.txt > l2.txt
          for i in 0 1 2 3 4 5; do part=$(tail -c +$((i*3800+1)) l2.txt | head -c 3800 | tr '\n' '~'); [ -z "$part" ] && break; echo "::notice title=n$i::$part"; done
