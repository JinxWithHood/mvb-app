name: diag-formation
on:
  push:
    branches: [diag-formation]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: bahnhof.de departure data
        shell: bash {0}
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          curl -s -L -A "$UA" -m 30 https://www.bahnhof.de/magdeburg-hbf/abfahrt -o dep.html
          curl -s -L -A "$UA" -H 'RSC: 1' -m 30 https://www.bahnhof.de/magdeburg-hbf/abfahrt -o dep.rsc
          python3 - <<'PY' > rep.txt
          import re
          for fn in ['dep.html', 'dep.rsc']:
              s = open(fn, encoding='utf-8', errors='replace').read().replace('\\"', '"')
              print(fn, len(s), {k: s.count(k) for k in ['journeyID', 'journeyId', 'departureID', 'ICE', 'RE ', 'wagenreihung', 'coach', 'evaNumber', 'hasCoachSequence', 'sequence']})
              for k in ['journeyId', 'journeyID', 'ICE']:
                  i = s.find(k)
                  if i >= 0:
                      print('SNIP', fn, k, re.sub(r'\s+', ' ', s[max(0, i - 300): i + 700]))
                      break
          PY
          echo "::notice title=d1::$(head -c 3900 rep.txt | tr '\n' '~')"
          echo "::notice title=d2::$(tail -c +3900 rep.txt | head -c 3900 | tr '\n' '~')"
